[project]
name = "called-it"
version = "0.1.0"
description = "CALLED IT. workspace root (non-package): Earnings Nowcaster monorepo"
requires-python = ">=3.12"
dependencies = ["calledit-data", "called-it-nowcaster"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["data", "nowcaster"]

[tool.uv.sources]
calledit-data = { workspace = true }
called-it-nowcaster = { workspace = true }

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "hypothesis==6.170.15",
    "time-machine==3.6.0",
    "ruff==0.17.5",
    "opentimestamps==0.5.0",
]
# Linux CI runner only: `uv sync --group ots`. Not a default group because the
# `ots` CLI crashes on Windows (RESEARCH Pitfall 2).
ots = ["opentimestamps-client==0.8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=prepend -p no:cacheprovider"
markers = [
    "postgres: needs TEST_DATABASE_URL (scratch schema) or the CI postgres service",
    "slow: subprocess-heavy meta tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
