# CALLED IT. company universe (FOUND-03, PIT-05). Research and educational use only.
#
# This is the single config that decides which companies are locked. Set enabled = false to
# drop a company with no code change. universe_sha256 (the SHA-256 of these exact bytes) is
# hashed into every rules and prediction record, so every edit is visible in the chain.
# The file is LF-only and committed with -text (.gitattributes) so its bytes are stable.
#
# Strings must stay printable ASCII without double quotes or backslashes (calledit-ledger-v1).
# Unconfirmed values (isin_confirmed = false, confirmed = false) are refused by live locks
# until the user confirms them (Plan 01-10).

